[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mave-tts"
version = "0.1.0"
description = "MAVE Text-to-Speech & Audio Output Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.22.0",
    "av>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
